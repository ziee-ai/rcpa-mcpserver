# Conda environment for running and testing rcpa.mcpserver locally.
#
#   conda env create -f environment.yml
#   # mcpserver-r is not yet on CRAN; install from the sibling source tree:
#   conda run -n rcpa-mcp R CMD INSTALL /data/khoi/home-iso/mcp-hubs/mcpserver-r
#   conda run -n rcpa-mcp R CMD INSTALL .
#   conda run -n rcpa-mcp Rscript inst/run-stdio.R      # stdio transport
#   conda run -n rcpa-mcp Rscript inst/run-http.R       # HTTP transport
#
# RCPA's dependency closure (limma, DESeq2, edgeR, SummarizedExperiment,
# ROntoTools, fgsea, ...) IS bundled below from conda-forge/bioconda so the
# analysis tools work. RCPA itself (github tinnlab/RCPA) is NOT on conda —
# install it after the env exists:
#   conda run -n rcpa-mcp Rscript -e 'remotes::install_github("tinnlab/RCPA")'
# CePa (RCPA's optional "CePa" pathway method) is also not on conda — it's an
# archived CRAN package; install it only if you need that method:
#   conda run -n rcpa-mcp Rscript -e 'install.packages(
#     "https://cran.r-project.org/src/contrib/Archive/CePa/CePa_0.8.0.tar.gz", repos=NULL)'
name: rcpa-mcp
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base>=4.3
  # build toolchain (compiling any source-only R packages)
  - make
  - pkg-config
  # mcpserver-r runtime deps (covers both packages)
  - r-r6
  - r-jsonlite
  - r-jsonvalidate
  - r-httr2
  - r-jose
  - r-later
  - r-mirai
  - r-nanonext
  - r-processx
  - r-promises
  - r-openssl
  - r-rlang
  - r-dbi
  - r-rsqlite
  # ---- RCPA analysis stack (RCPA Depends + Imports, on conda) --------------
  - r-tidyr
  - r-dplyr
  - r-ggplot2
  - r-stringr
  - r-ggnewscale
  - r-ggrepel
  - r-httr
  - r-ggpattern
  - r-scales
  - r-robustrankaggreg
  - r-irdisplay
  - r-biocmanager
  - bioconductor-annotationdbi
  - bioconductor-biobase
  - bioconductor-summarizedexperiment
  - bioconductor-s4vectors
  - bioconductor-deseq2
  - bioconductor-edger
  - bioconductor-limma
  - bioconductor-geoquery
  - bioconductor-graph
  # ---- analysis-method deps the tools exercise (RCPA Suggests) ------------
  - bioconductor-rontotools   # ORA / topology-based pathway analysis
  - bioconductor-fgsea        # GSEA
  - r-gsa                     # GSA pathway method
  - r-meta                    # meta-analysis (meta_de / meta_pa tools)
  - r-png                     # PNG export in plot_results
  - r-ggvenn                  # consensus overlap (venn) plots
  # test + dev tooling
  - r-testthat
  - r-withr
  - r-mockery
  - r-remotes
  - r-devtools
  - r-roxygen2
